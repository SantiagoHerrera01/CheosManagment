name: ✨ Sugerir funcionalidad
description: Propón una mejora o un módulo nuevo
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Las ideas se alinean con los requisitos del cliente (R1–R10) descritos en
        `docs/REVISION-2026-10-22.md`.

  - type: input
    id: modulo
    attributes:
      label: Módulo
      placeholder: Facturación, Cartera, Producción, Gastos, Utilidad…
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
      placeholder: Hoy no hay forma de registrar abonos parciales y el cliente se enreda con los saldos.
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: ¿Cómo debería funcionar?
      placeholder: Botón "Abonar" en la fila de la factura → modal con monto → actualiza saldo y estado.
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad percibida
      options:
        - Crítica (bloquea el trabajo diario)
        - Alta
        - Media
        - Baja (nice to have)
    validations:
      required: true

  - type: checkboxes
    id: requisitos
    attributes:
      label: Relación con requisitos del cliente
      options:
        - label: R1 · Facturación
        - label: R2 · Cartera y abonos
        - label: R3 · Inventario producto terminado
        - label: R4 · Producción y mermas
        - label: R5 · Insumos y empaque
        - label: R6 · Gastos
        - label: R7 · Costos y utilidad
        - label: R8 · Alertas y reportes
        - label: R9 · Envío por WhatsApp
        - label: R10 · UX autónoma / móvil
        - label: Ninguno en particular

  - type: textarea
    id: extras
    attributes:
      label: Contexto adicional, mockups o referencias
