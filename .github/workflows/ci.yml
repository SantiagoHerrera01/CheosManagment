name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck + prisma + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy para que Prisma pueda validar el schema en CI (no se conecta a la BD)
      DATABASE_URL: postgresql://postgres:password@localhost:5432/cheo_manager?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar schema de Prisma
        run: npx prisma validate

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Compilar TypeScript
        run: npm run build

  frontend:
    name: Frontend · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Informativo hasta cerrar la deuda técnica (11 errores conocidos, Fase 5).
      # Cuando `npm run lint` pase limpio, quitar `continue-on-error`.
      - name: ESLint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck + build
        run: npm run build
