name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Prisma + typecheck + build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      # Dummy: Prisma debe resolver DATABASE_URL en CI (no se conecta a la BD)
      DATABASE_URL: postgresql://postgres:password@localhost:5432/cheo_manager?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Validar schema de Prisma
        run: npm run db:validate

      # Informativo hasta cerrar la deuda técnica (11 errores conocidos, Fase 5).
      # Cuando `lint` pase limpio, quitar `continue-on-error`.
      - name: ESLint (informativo)
        run: npx turbo run lint --output-logs=errors-only
        continue-on-error: true

      - name: Typecheck + build
        run: npx turbo run typecheck build --output-logs=full
