# ============================================================
#  Cheo Manager — Docker Compose (entorno de desarrollo)
#
#   docker compose up -d      → levanta BD + backend
#   docker compose down       → detiene (los datos persisten)
#   docker compose down -v    → detiene y BORRA los datos
#
#  El frontend NO va en contenedor: se corre en local con
#  `npm run dev:frontend` (Vite en Windows + bind mounts es lento).
# ============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: cheo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheo
      POSTGRES_PASSWORD: cheo_dev_password
      POSTGRES_DB: cheo_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheo -d cheo_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: cheo-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # dotenv NO sobreescribe variables ya definidas → esta gana sobre backend/.env
      DATABASE_URL: postgresql://cheo:cheo_dev_password@db:5432/cheo_manager?schema=public
      # File watching fiable sobre bind mounts (Windows/WSL2)
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Mantiene las dependencias instaladas dentro del contenedor,
      # sin chocar con el node_modules de Windows del anfitrión
      - node_modules:/app/node_modules

volumes:
  pgdata:
  node_modules:
